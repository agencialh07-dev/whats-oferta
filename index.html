<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsOferta</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <main class="page">
    <div class="card">
      <h1 class="card__title">What is your partner doing on <span>WhatsApp?</span></h1>
      <p class="card__text">
        Enter the number you want to spy on. Discover messages, photos and location in real time.
      </p>

      <form class="form" id="offer-form">
        <label class="field-label" for="phone">
          <svg class="field-label__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17 1H7C5.34 1 4 2.34 4 4v16c0 1.66 1.34 3 3 3h10c1.66 0 3-1.34 3-3V4c0-1.66-1.34-3-3-3zm-5 21c-.83 0-1.5-.67-1.5-1.5S11.17 19 12 19s1.5.67 1.5 1.5S12.83 22 12 22zM17.5 17h-11V4h11v13z" fill="currentColor"/>
          </svg>
          WhatsApp Number
        </label>

        <div class="phone-input">
          <select class="phone-input__code" id="phone-ddi" name="ddi" aria-label="Country code">
            <option value="55" data-placeholder="11 99999-8765" selected>🇧🇷 +55</option>
            <option value="1" data-placeholder="201 555-0123">🇺🇸 +1</option>
            <option value="351" data-placeholder="912 345 678">🇵🇹 +351</option>
            <option value="54" data-placeholder="11 2345-6789">🇦🇷 +54</option>
            <option value="598" data-placeholder="9 1234 5678">🇺🇾 +598</option>
            <option value="595" data-placeholder="981 234567">🇵🇾 +595</option>
            <option value="591" data-placeholder="71234567">🇧🇴 +591</option>
            <option value="56" data-placeholder="9 1234 5678">🇨🇱 +56</option>
            <option value="57" data-placeholder="300 1234567">🇨🇴 +57</option>
            <option value="58" data-placeholder="412 1234567">🇻🇪 +58</option>
            <option value="34" data-placeholder="612 345 678">🇪🇸 +34</option>
            <option value="44" data-placeholder="7700 900123">🇬🇧 +44</option>
          </select>
          <input
            class="phone-input__number"
            type="tel"
            id="phone"
            name="phone"
            placeholder="11 99999-8765"
            inputmode="numeric"
            autocomplete="tel-national"
            required
          />
        </div>
        <span class="field-error" id="phone-error">Enter a valid WhatsApp number.</span>

        <button class="submit-btn" type="submit" id="submit-btn">
          <span class="submit-btn__progress" id="submit-progress"></span>
          <span class="submit-btn__label" id="submit-label">SPY NOW</span>
        </button>
        <p class="disclaimer">
          100% anonymous · No trace · Encrypted
        </p>
      </form>
    </div>
  </main>

  <script src="assets/js/script.js"></script>
</body>
</html>
